  background: var(--rt-card);
  border: 1px solid var(--rt-line);
  border-radius: 10px;
  cursor: pointer;
  touch-action: manipulation;       /* no double-tap zoom delay */
}
.rt-btn:active { background: #eaeef2; }
.rt-btn-primary { background: var(--rt-accent); border-color: var(--rt-accent); color: #fff; }
.rt-btn-primary:active { background: #1e40af; }
.rt-btn-wide { display: block; width: 100%; text-align: left; margin: 0 0 10px 0; min-height: 52px; }
.rt-btn-onred { background: #fff; color: var(--rt-red); border-color: #fff; margin-left: auto; flex: none; }

/* ---------- 1. Top bar ---------- */
#rt-topbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--rt-bar-h);
  padding: 6px 10px;
  padding-top: calc(6px + env(safe-area-inset-top));
  padding-left: calc(10px + env(safe-area-inset-left));
  padding-right: calc(10px + env(safe-area-inset-right));
  background: var(--rt-card);
  border-bottom: 1px solid var(--rt-line);
}
.rt-project-name {
  font-weight: 700;
  font-size: 17px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 60px;
  flex: 0 1 auto;
  max-width: 30%;
}
.rt-sheet-picker {
  min-height: var(--rt-touch);
  font: inherit;
  font-size: 16px;                  /* 16 px stops iOS from zooming the page on focus */
  padding: 6px 10px;
  border: 1px solid var(--rt-line);
  border-radius: 10px;
  background: var(--rt-card);
  color: var(--rt-ink);
  flex: 0 1 260px;
  min-width: 90px;
  max-width: 40%;
}
.rt-spacer { flex: 1 1 0; min-width: 0; }

/* The save chip. Its look changes with data-state, and the words always say the state too. */
.rt-save-chip {
  flex: 0 1 auto;
  min-height: 32px;
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 16px;
  border: 1px solid var(--rt-line);
  font-size: 13px;
  font-weight: 600;
  background: #eef1f4;
  color: var(--rt-ink-soft);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 44%;
}
.rt-save-chip:empty { display: none; }
.rt-save-chip[data-state="saved"]  { background: #e6f4ea; border-color: #9fd3ae; color: #14532d; }
.rt-save-chip[data-state="dirty"]  { background: #fff7d6; border-color: #e5c558; color: #6b4e00; }
.rt-save-chip[data-state="saving"] { background: #e7efff; border-color: #a9c1f5; color: #1e3a8a; }
.rt-save-chip[data-state="failed"] { background: var(--rt-red); border-color: var(--rt-red); color: #fff; }
.rt-save-chip[data-state="off"]    { background: #eef1f4; color: var(--rt-ink-soft); }
.rt-menu-btn { flex: none; }

/* ---------- Banners ---------- */
#rt-banners { flex: none; }
.rt-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 14px;
  padding-left: calc(14px + env(safe-area-inset-left));
  padding-right: calc(14px + env(safe-area-inset-right));
  font-size: 15px;
}
.rt-banner-yellow { display: block; background: var(--rt-yellow); color: #5c4400; border-bottom: 1px solid #e5c558; }
.rt-banner-red { background: var(--rt-red); color: #fff; font-weight: 600; }

/* ---------- Body: plan + panel ---------- */
#rt-body {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: row;              /* landscape: panel on the right */
}

/* ---------- 2. Plan area ---------- */
#rt-planwrap {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  background: #dfe3e8;
}
#rt-plan {
  position: absolute;
  inset: 0;
  background: #dfe3e8;              /* gray "desk" around the white sheet */
  touch-action: none;               /* the plan handles pinch and drag itself */
}
.rt-fit-btn {
  position: absolute;
  left: calc(12px + env(safe-area-inset-left));
  bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 800;                     /* above the map layers, inside the plan region */
  box-shadow: 0 1px 4px rgba(0,0,0,.25);
}
.rt-plan-empty {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--rt-ink-soft);
  pointer-events: none;
  z-index: 1;
}
.rt-has-project .rt-plan-empty { display: none; }

/* Leaflet overrides: no attribution box, white paper behind tiles */
#rt-plan.leaflet-container { background: #dfe3e8; font: inherit; }
#rt-plan .leaflet-tile { background: #fff; }
#rt-plan .leaflet-control-attribution { display: none; }

/* Room outlines. Colors are set by the viewer; these rules add the non-color signals. */
path.rt-room { cursor: pointer; transition: fill-opacity .08s; }
path.rt-room[data-state="na"] { stroke-dasharray: 7 5; }
path.rt-room.rt-room-selected { stroke: #f59e0b; stroke-width: 5; }
path.rt-room.rt-room-pulse { animation: rt-pulse 0.5s ease-in-out 3; }
@keyframes rt-pulse { 50% { stroke-width: 9; stroke: #f59e0b; } }

/* Fraction badge inside a room, for example "3/8" or a check mark plus "8/8". */
.rt-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  color: var(--rt-ink);
  background: rgba(255,255,255,.92);
  border: 1.5px solid #5f6368;
  border-radius: 12px;
  white-space: nowrap;
  pointer-events: none;             /* a tap on the badge goes through to the room */
}
.rt-badge[data-state="progress"] { border-color: var(--rt-accent); color: #1e3a8a; }
.rt-badge[data-state="done"] { background: var(--rt-green); border-color: #14532d; color: #fff; }
.rt-badge[data-state="na"] { border-style: dashed; color: var(--rt-ink-soft); }

/* ---------- 3. The one panel ---------- */
#rt-panel {
  flex: none;
  width: 360px;
  max-width: 45%;
  display: flex;
  flex-direction: column;
  background: var(--rt-card);
  border-left: 1px solid var(--rt-line);
  min-height: 0;
  padding-right: env(safe-area-inset-right);
  padding-bottom: env(safe-area-inset-bottom);
}
.rt-panel-head {
  flex: none;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 12px 12px 10px 16px;
  border-bottom: 1px solid var(--rt-line);
}
.rt-panel-headtext { flex: 1 1 0; min-width: 0; }
.rt-panel-title { font-size: 20px; font-weight: 700; margin: 0; overflow-wrap: anywhere; }
.rt-panel-sub { font-size: 14px; color: var(--rt-ink-soft); margin-top: 2px; }
.rt-panel-progress { font-size: 15px; font-weight: 600; margin-top: 6px; }
.rt-progressbar { height: 8px; border-radius: 4px; background: #e5e9ee; overflow: hidden; margin-top: 6px; }
.rt-progressbar > i { display: block; height: 100%; background: var(--rt-accent); }
.rt-progressbar[data-state="done"] > i { background: var(--rt-green); }
.rt-panel-body {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 10px 12px 16px 12px;
}
.rt-panel-note { color: var(--rt-ink-soft); font-size: 15px; padding: 8px 4px; }

/* A checklist row: one big button. The box shows the state, the words repeat it. */
.rt-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 60px;
  margin: 0 0 8px 0;
  padding: 8px 12px;
  text-align: left;
  font: inherit;
  font-size: 17px;
  color: var(--rt-ink);
  background: var(--rt-card);
  border: 1.5px solid var(--rt-line);
  border-radius: 12px;
  cursor: pointer;
  touch-action: manipulation;
}
.rt-item-box {
  flex: none;
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid #5f6368;
  border-radius: 8px;
  font-size: 22px; font-weight: 800; line-height: 1;
  color: transparent;
  background: #fff;
}
.rt-item-text { flex: 1 1 0; min-width: 0; }
.rt-item-label { font-weight: 600; overflow-wrap: anywhere; }
.rt-item-meta { font-size: 12.5px; color: var(--rt-ink-soft); margin-top: 2px; }
.rt-item-state { flex: none; font-size: 13px; font-weight: 700; color: var(--rt-ink-soft); text-transform: uppercase; }
.rt-item[aria-pressed="true"] { background: #e9f7ee; border-color: #86c79b; }
.rt-item[aria-pressed="true"] .rt-item-box { background: var(--rt-green); border-color: #14532d; color: #fff; }
.rt-item[aria-pressed="true"] .rt-item-state { color: #14532d; }
.rt-item[data-state="na"] { background: #f1f3f5; border-style: dashed; }
.rt-item[data-state="na"] .rt-item-label { text-decoration: line-through; color: var(--rt-ink-soft); }

/* Portrait: the same panel becomes a bottom sheet. */
@media (orientation: portrait) {
  #rt-body { flex-direction: column; }
  #rt-panel {
    width: auto;
    max-width: none;
    height: 46%;
    border-left: 0;
    border-top: 1px solid var(--rt-line);
    border-radius: 14px 14px 0 0;
    box-shadow: 0 -2px 10px rgba(0,0,0,.12);
    padding-right: 0;
  }
}

/* ---------- 4. The one dialog layer (full screen) ---------- */
#rt-dialog {
  position: absolute;
  inset: 0;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  background: var(--rt-bg);
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
.rt-dialog-head {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--rt-bar-h);
  padding: 6px 14px;
  background: var(--rt-card);
  border-bottom: 1px solid var(--rt-line);
}
.rt-dialog-title { flex: 1 1 0; font-size: 20px; font-weight: 700; margin: 0; }
.rt-dialog-body {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 18px 16px 28px 16px;
}
.rt-dialog-col { max-width: 640px; margin: 0 auto; }
.rt-dialog-col h3 { font-size: 17px; margin: 22px 0 8px 0; }
.rt-dialog-col p { margin: 0 0 12px 0; }
.rt-help { color: var(--rt-ink-soft); font-size: 14.5px; }

.rt-card {
  background: var(--rt-card);
  border: 1px solid var(--rt-line);
  border-radius: 12px;
  padding: 14px;
  margin: 0 0 14px 0;
}

/* Text inputs: 16 px or larger so iOS does not zoom the page. */
.rt-input, .rt-textarea {
  display: block;
  width: 100%;
  min-height: var(--rt-touch);
  padding: 10px 12px;
  font: inherit;
  font-size: 17px;
  color: var(--rt-ink);
  background: #fff;
  border: 1.5px solid #8c959f;
  border-radius: 10px;
  margin: 0 0 12px 0;
}
.rt-textarea { min-height: 180px; resize: vertical; }

/* File pickers: the real <input type=file> is kept (tests and iPad both need it),
   wrapped in a large label so the whole block is one easy target. */
.rt-filepick {
  display: block;
  padding: 12px 14px;
  border: 1.5px dashed #8c959f;
  border-radius: 12px;
  background: #fff;
  margin: 0 0 12px 0;
  font-weight: 600;
  cursor: pointer;
}
.rt-filepick input[type="file"] {
  display: block;
  width: 100%;
  min-height: var(--rt-touch);
  margin-top: 8px;
  font: inherit;
  font-size: 16px;
}

/* Project rows on the Projects screen */
.rt-project-row {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: 100%;
  min-height: 60px;
  margin: 0 0 10px 0;
  padding: 10px 14px;
  text-align: left;
  font: inherit;
  background: #fff;
  border: 1.5px solid var(--rt-line);
  border-radius: 12px;
  cursor: pointer;
  touch-action: manipulation;
}
.rt-project-row strong { font-size: 17px; }
.rt-project-row span { font-size: 13.5px; color: var(--rt-ink-soft); }
.rt-project-row[data-current="1"] { border-color: var(--rt-accent); }

.rt-share-result { font-size: 18px; font-weight: 700; min-height: 26px; margin: 10px 0; }
.rt-share-result[data-result="shared"], .rt-share-result[data-result="downloaded"] { color: var(--rt-green); }
.rt-share-result[data-result="cancelled"], .rt-share-result[data-result="failed"], .rt-share-result[data-result="error"] { color: var(--rt-red); }

/* STATUS import question: both save times, what differs, Replace mine or Cancel. */
.rt-import-dialog { border: 2px solid var(--rt-accent); border-radius: 12px; padding: 12px; margin: 12px 0; background: #f8fafc; }
.rt-import-table { border-collapse: collapse; width: 100%; margin: 0 0 12px 0; font-size: 15px; }
.rt-import-table th, .rt-import-table td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--rt-line); }
.rt-import-table tr:first-child th { font-size: 14px; color: var(--rt-ink-soft); }
.rt-warn { background: #fef3c7; border: 1px solid #d97706; border-radius: 8px; padding: 8px 10px; }
.rt-import-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
.rt-import-buttons .rt-btn { min-width: 140px; }

.rt-checklist-current { margin: 0; padding: 0 0 0 22px; }
.rt-checklist-current li { padding: 3px 0; }
.rt-code { display: inline-block; min-width: 38px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: var(--rt-ink-soft); }

.rt-progressline { height: 10px; border-radius: 5px; background: #e5e9ee; overflow: hidden; margin: 8px 0; }
.rt-progressline > i { display: block; height: 100%; width: 0; background: var(--rt-accent); }

/* ---------- Toast ---------- */
.rt-toast {
  position: absolute;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 3000;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: min(92%, 560px);
  padding: 10px 14px;
  background: #1b1f24;
  color: #fff;
  border-radius: 12px;
  font-size: 15.5px;
  box-shadow: 0 2px 10px rgba(0,0,0,.3);
}
.rt-toast button {
  min-height: var(--rt-touch);
  min-width: 64px;
  font: inherit;
  font-weight: 700;
  color: #fff;
  background: transparent;
  border: 1.5px solid #fff;
  border-radius: 10px;
  cursor: pointer;
}

/* Narrow screens: keep the top bar on one line */
@media (max-width: 900px) {
  .rt-project-name { max-width: 24%; font-size: 16px; }
  .rt-save-chip { font-size: 12px; max-width: 38%; }
  .rt-sheet-picker { max-width: 30%; }
}

</style>
</head>
<body>

<!--
  The whole screen is built from four fixed regions (spec section 7.1):
    1. the top bar            (#rt-topbar)
    2. the plan area          (#rt-plan, inside #rt-planwrap)
    3. one panel              (#rt-panel: right side in landscape, bottom sheet in portrait)
    4. one full-screen layer  (#rt-dialog)
  Opening something replaces what is in its region. Nothing stacks.
-->
<div id="rt-app">

  <!-- 1. TOP BAR -->
  <header id="rt-topbar">
    <span class="rt-project-name" data-testid="project-name"></span>
    <label class="rt-visually-hidden" for="rt-sheet-picker">Sheet</label>
    <select id="rt-sheet-picker" class="rt-sheet-picker" data-testid="sheet-picker" aria-label="Sheet"></select>
    <span class="rt-spacer"></span>
    <span class="rt-save-chip" data-testid="save-chip" data-state="off" role="status" aria-live="polite"></span>
    <button type="button" class="rt-btn rt-menu-btn" data-testid="menu-btn" aria-label="Menu">&#9776; Menu</button>
  </header>

  <!-- Banners sit directly under the top bar and push the plan down. They never cover it. -->
  <div id="rt-banners">
    <div class="rt-banner rt-banner-yellow" data-testid="tab-warning" role="status" hidden>
      <strong>Not installed.</strong>
      Safari can erase saved work after 7 days without use. Add to Home Screen:
      tap the Share button, then "Add to Home Screen", then open the app from the Home Screen.
    </div>
    <div class="rt-banner rt-banner-red" data-testid="not-saved-banner" role="alert" hidden>
      <strong>NOT SAVED.</strong>
      <span>Your latest changes are not stored on this device. Share an update now so nothing is lost.</span>
      <button type="button" class="rt-btn rt-btn-onred" id="rt-share-now">Share now</button>
    </div>
  </div>

  <div id="rt-body">
    <!-- 2. PLAN AREA -->
    <div id="rt-planwrap">
      <div id="rt-plan"></div>
      <button type="button" class="rt-btn rt-fit-btn" data-testid="fit-btn" aria-label="Fit the whole sheet on screen">Fit</button>
      <div class="rt-plan-empty" id="rt-plan-empty">No project open.</div>
    </div>

    <!-- 3. THE ONE PANEL -->
    <aside id="rt-panel" hidden></aside>
  </div>

  <!-- 4. THE ONE DIALOG LAYER -->
  <div id="rt-dialog" role="dialog" aria-modal="true" hidden></div>

  <!-- Short messages ("Saved", "Undo") appear here for a few seconds. -->
  <div class="rt-toast" data-testid="toast" role="status" aria-live="polite" hidden></div>
</div>

/* ==========================================================================

   importing) lives in rt-main.js as RT.app.*, and the data lives in RT.state.

  // =========================================================================

  // Fill in the project name and the sheet picker for the project now loaded.
  ui.projectLoaded = function () {

        if (s.level) { parts.push(s.level); }
        if (s.number) { parts.push(s.number); }
        if (s.title) { parts.push(s.title); }
        opt.textContent = parts.length ? parts.join(' · ') : s.id;

      '<p>1. Tap the Share button (the square with an arrow).<br>2. Tap "Add to Home Screen".<br>' +
      '3. Open Room Tracker from the Home Screen and open your project there.</p>' +
      '</div>';
  }

  // ---- Projects screen -------------------------------------------------------
  ui.showProjects = function () {
    var hasDoc = !!(RT.state && RT.state.doc);
    var embeddedOnly = RT.util.kind() === 'project';
    // With no project open there is nothing behind this screen, so no Close button.
    var col = ui.showDialog('Projects', { closable: hasDoc, name: 'projects' });
    var wrap = el('<div data-testid="projects-screen"></div>');
    col.appendChild(wrap);

    if (embeddedOnly) {
      // A double-clicked PROJECT file holds exactly one project: itself.
      wrap.innerHTML =
        '<div class="rt-card"><p><strong>' + esc(hasDoc ? RT.state.doc.project.name : '') + '</strong></p>' +
        '<p class="rt-help">This is a PROJECT file. It holds this one project. ' +
        'To keep several projects on one device, use the installed Room Tracker app and choose Open project there.</p></div>';
      return;
    }

    wrap.innerHTML =
      installHelpHtml() +
      '<h3>On this device</h3>' +
      '<div id="rt-project-list"><p class="rt-help">Looking…</p></div>' +
      '<h3>Open a project</h3>' +
      '<label class="rt-filepick">Open project: choose a PROJECT file (the big .html file for your building)' +
        '<input type="file" data-testid="open-project-input">' +     // no "accept": filters gray out files on iPad
      '</label>' +
      '<div class="rt-progressline" id="rt-import-bar" hidden><i></i></div>' +
      '<p class="rt-help" id="rt-import-msg" role="status"></p>' +
      '<h3>Try it</h3>' +
      '<button type="button" class="rt-btn" data-testid="load-sample">Load sample</button>' +
      '<p class="rt-help" style="margin-top:8px">The sample is a made-up floor plan for practice. It holds no real project data.</p>';

    var msg = wrap.querySelector('#rt-import-msg');
    var bar = wrap.querySelector('#rt-import-bar');
    var input = wrap.querySelector('[data-testid="open-project-input"]');

    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      if (!file) { return; }
      msg.textContent = 'Reading ' + file.name + '…';
      bar.hidden = false;
      bar.firstElementChild.style.width = '0%';
      RT.app.openProjectFile(file, function (info) {
        // Progress from the import: { phase, done, total, fraction, text }.
        if (!info) { return; }
        var f = Number(info.fraction);
        if (isFinite(f)) {
          bar.firstElementChild.style.width = Math.round(Math.max(0, Math.min(1, f)) * 100) + '%';
        }
        bar.setAttribute('data-phase', info.phase || '');
        if (info.text) { msg.textContent = info.text; }
      }).then(function (result) {
        bar.hidden = true;
        if (result && result.ok === false) { msg.textContent = result.message; input.value = ''; }
      });
    });

    wrap.querySelector('[data-testid="load-sample"]').addEventListener('click', function () {
      msg.textContent = 'Loading the sample…';
      RT.app.loadSample().then(function (result) {
        if (result && result.ok === false) { msg.textContent = result.message; }
      });
    });

    // The list of stored projects comes from the device database.
    var list = wrap.querySelector('#rt-project-list');
    RT.app.listProjects().then(function (rows) {
      if (ui.dialogName() !== 'projects') { return; }   // the user already moved on
      list.innerHTML = '';
      if (!rows.length) {
        list.appendChild(el('<p class="rt-help">No projects on this device yet. Open a PROJECT file or load the sample.</p>'));
        return;
      }
      rows.forEach(function (r) {
        var current = hasDoc && RT.state.projectId === r.id;
        var row = el(
          '<button type="button" class="rt-project-row" data-testid="project-row" data-project-id="' + esc(r.id) + '"' +
            (current ? ' data-current="1"' : '') + '>' +
            '<strong>' + esc(r.name || r.shortName || r.id) + (current ? ' (open now)' : '') + '</strong>' +
            '<span>Last saved: ' + esc(r.savedAt ? fmtLocal(r.savedAt) + ' (' + relAge(r.savedAt) + ')' : 'never') + '</span>' +
            '<span>Last shared: ' + esc(r.lastSharedAt ? fmtLocal(r.lastSharedAt) + ' (' + relAge(r.lastSharedAt) + ')' : 'never') + '</span>' +
          '</button>');
        row.addEventListener('click', function () { RT.app.openProjectById(r.id); });
        list.appendChild(row);
      });
    });
  };

  // ---- Checklist dialog (minimal: paste lines, add) ---------------------------
  ui.showChecklist = function () {
    var col = ui.showDialog('Checklist', { name: 'checklist' });
    col.innerHTML =
      '<div class="rt-card">' +
        '<p><strong>Add items.</strong> Type or paste your list, one item per line. Every room gets the same list.</p>' +
        '<textarea class="rt-textarea" data-testid="checklist-paste" aria-label="Checklist items, one per line" ' +
          'placeholder="Framing\nIn-wall rough-in\nInsulation\nDrywall\nPaint"></textarea>' +
        '<button type="button" class="rt-btn rt-btn-primary" data-testid="checklist-add">Add to checklist</button>' +
        '<p class="rt-help" id="rt-checklist-msg" role="status" style="margin-top:10px"></p>' +
      '</div>' +
      '<h3>Current checklist</h3>' +

    var area = col.querySelector('[data-testid="checklist-paste"]');
    var msg = col.querySelector('#rt-checklist-msg');

    function drawCurrent() {
      var items = RT.state.activeItems() || [];
      var box = col.querySelector('#rt-checklist-current');
      if (!items.length) { box.innerHTML = '<p class="rt-help">Empty. Add your first items above.</p>'; return; }
      box.innerHTML = '<ol class="rt-checklist-current">' + items.map(function (it) {
        return '<li><span class="rt-code">' + esc(it.code || '') + '</span> ' + esc(it.label) + '</li>';
      }).join('') + '</ol>';
    }
    drawCurrent();

    col.querySelector('[data-testid="checklist-add"]').addEventListener('click', function () {
      // One item per line. Blank lines are skipped.
      var labels = area.value.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
      if (!labels.length) { msg.textContent = 'Nothing to add. Type at least one line.'; return; }
      Promise.resolve(RT.state.addChecklistItems(labels)).then(function () {
        area.value = '';
        msg.textContent = 'Added ' + labels.length + (labels.length === 1 ? ' item.' : ' items.') + ' Every room now shows them.';

  // ---- Share dialog ------------------------------------------------------------
  ui.showShare = function () {
    var col = ui.showDialog('Share', { name: 'share' });
    var doc = RT.state.doc;
    col.innerHTML =
      '<div class="rt-card">' +
        '<p><strong>Share update.</strong> Makes a small STATUS file with every check on this device and the save time. ' +
        'Send it by email or save it. Anyone can read it, and Room Tracker can import it.</p>' +
        '<button type="button" class="rt-btn rt-btn-primary" data-testid="share-update">Share update</button>' +
        '<div class="rt-share-result" data-testid="share-result" role="status"></div>' +
        '<p class="rt-help" id="rt-share-problem" role="status"></p>' +
        '<p class="rt-help">Last shared: <span id="rt-last-shared">' +
          esc(doc.meta && doc.meta.lastSharedAt ? fmtLocal(doc.meta.lastSharedAt) : 'never') + '</span></p>' +
      '</div>' +
      '<div class="rt-card" id="rt-import-card">' +
        '<p><strong>Import a STATUS file.</strong> Pick a STATUS file for this same project. ' +
        'You will see both save times and what differs before anything changes.</p>' +
        '<label class="rt-filepick">Choose a STATUS file' +
          '<input type="file" data-testid="import-status-input">' +   // no "accept" on purpose
        '</label>' +
        '<p class="rt-help" id="rt-import-status-msg" role="status"></p>' +
        '<div id="rt-import-ask"></div>' +
        '<div class="rt-share-result" data-testid="import-result" role="status"></div>' +
      '</div>';

    var result = col.querySelector('[data-testid="share-result"]');
    col.querySelector('[data-testid="share-update"]').addEventListener('click', function () {
      // RT.app.shareUpdate must start inside this tap, or the iPad refuses to open the share sheet.
      ui.runShare(result);
    });

    var input = col.querySelector('[data-testid="import-status-input"]');
    var msg = col.querySelector('#rt-import-status-msg');
    var ask = col.querySelector('#rt-import-ask');
    var importResult = col.querySelector('[data-testid="import-result"]');
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      if (!file) { return; }
      msg.textContent = 'Reading ' + file.name + '…';
      ask.innerHTML = '';
      importResult.textContent = '';
      RT.app.prepareStatusImport(file).then(function (r) {
        input.value = '';
        msg.textContent = '';
        if (!r.ok) { importResult.textContent = 'Not imported. ' + r.message; return; }
        showImportAsk(ask, importResult, file.name, r);
      });
    });
  };

  // The import question (spec section 10): both save times, how much differs,
  // then Replace mine or Cancel. Nothing changes until Replace mine is tapped.
  function showImportAsk(box, resultEl, fileName, prep) {
    var s = prep.summary, d = s.diff;
    function when(iso) { return iso ? esc(RT.util.fmtLocalFull(iso)) + ' (' + esc(relAge(iso)) + ')' : 'never'; }
    var differ = (d.items || d.checklist || d.notes)
      ? d.items + ' check' + (d.items === 1 ? '' : 's') + ' differ' + (d.items === 1 ? 's' : '') + ' in ' + d.rooms +
        ' room' + (d.rooms === 1 ? '' : 's') + '.' +
        (d.checklist ? ' ' + d.checklist + ' checklist item' + (d.checklist === 1 ? '' : 's') + ' differ' + (d.checklist === 1 ? 's' : '') + '.' : '') +
        (d.notes ? ' ' + d.notes + ' room note' + (d.notes === 1 ? '' : 's') + ' differ' + (d.notes === 1 ? 's' : '') + '.' : '')
      : 'The file and this device already hold the same checks.';
    box.innerHTML =
      '<div class="rt-import-dialog" data-testid="import-dialog" role="group" aria-label="Import a STATUS file">' +
        '<p><strong>Replace the work on this device with ' + esc(fileName) + '?</strong></p>' +
        '<table class="rt-import-table">' +
          '<tr><th></th><th>This device</th><th>The file</th></tr>' +
          '<tr><th>Saved</th><td data-testid="import-mine-saved">' + when(s.mine.savedAt) + '</td>' +
            '<td data-testid="import-theirs-saved">' + when(s.theirs.savedAt) + '</td></tr>' +
          '<tr><th>Last change</th><td>' + when(s.mine.changedAt) + '</td><td>' + when(s.theirs.changedAt) + '</td></tr>' +
          '<tr><th>Device</th><td>' + esc(s.mine.device || 'not named') + '</td><td>' + esc(s.theirs.device || 'not named') + '</td></tr>' +
        '</table>' +
        '<p data-testid="import-differ">' + esc(differ) + '</p>' +
        (s.theirsOlder ? '<p class="rt-warn"><strong>The file is older.</strong> Its last change is before the last change on this device. ' +
          'Replacing undoes the newer work done here.</p>' : '') +
        '<p class="rt-help">Replace mine makes this device match the file exactly. Combining both sides (merge) comes in a later version. ' +
          'If the two clocks look wrong, tap Cancel.</p>' +
        '<div class="rt-import-buttons">' +
          '<button type="button" class="rt-btn rt-btn-primary" data-testid="import-replace">Replace mine</button>' +
          '<button type="button" class="rt-btn" data-testid="import-cancel">Cancel</button>' +
        '</div>' +
      '</div>';
    var replace = box.querySelector('[data-testid="import-replace"]');
    var cancel = box.querySelector('[data-testid="import-cancel"]');
    // Bring the whole question, buttons included, into view.
    try { box.firstElementChild.scrollIntoView({ block: 'nearest' }); } catch (e) { /* older browsers */ }
    replace.addEventListener('click', function () {
      replace.disabled = true; cancel.disabled = true;
      RT.app.applyStatusImport(prep.statusObj).then(function (r) {
        box.innerHTML = '';
        resultEl.textContent = r.message;
        if (r.ok) { ui.toast(r.message, { ms: 6000 }); }
      });
    });
    cancel.addEventListener('click', function () {
      box.innerHTML = '';
      resultEl.textContent = 'Not imported. Nothing was changed.';
    });
  }

  // Run "Share update" and show the honest outcome: "Shared", "Downloaded" or "Not shared".
  // resultEl is optional (the red banner's Share now button has none).
  ui.runShare = function (resultEl) {
    if (resultEl) { resultEl.textContent = ''; resultEl.removeAttribute('data-result'); }
    var problemEl = document.getElementById('rt-share-problem');
    if (problemEl) { problemEl.textContent = ''; }
    return RT.app.shareUpdate().then(function (outcome) {
      var words = { shared: 'Shared', downloaded: 'Downloaded', cancelled: 'Not shared', failed: 'Not shared', error: 'Not shared' };
      var word = words[outcome] || 'Not shared';
      var why = outcome === 'failed' ? (RT.files.lastShareProblem || 'Nothing was sent.')
        : outcome === 'cancelled' ? 'The share sheet was closed. Nothing was sent.' : '';
      if (resultEl && resultEl.isConnected) {
        resultEl.textContent = word;
        if (problemEl && problemEl.isConnected) { problemEl.textContent = why; }
        resultEl.setAttribute('data-result', words[outcome] ? outcome : 'error');
        var last = document.getElementById('rt-last-shared');
        var doc = RT.state.doc;
        if (last && doc && doc.meta && doc.meta.lastSharedAt) { last.textContent = fmtLocal(doc.meta.lastSharedAt); }
      } else {
        ui.toast(why ? word + '. ' + why : word, { ms: why ? 8000 : 3500 });
      }
      return outcome;
    });
  };

  // =========================================================================
  // TOAST
  // =========================================================================
  // ui.toast('text') or ui.toast('text', { actionLabel: 'Undo', onAction: fn, ms: 5000 })
  ui.toast = function (text, opts) {
    opts = opts || {};
    var t = tid('toast');
    clearTimeout(toastTimer);
    t.innerHTML = '';
    var span = document.createElement('span');
    span.textContent = text;
    t.appendChild(span);
    if (opts.actionLabel && opts.onAction) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = opts.actionLabel;
      b.setAttribute('data-testid', 'toast-action');
      b.addEventListener('click', function () {
        clearTimeout(toastTimer);
        t.hidden = true;
        opts.onAction();
      });
      t.appendChild(b);
    }
    t.hidden = false;
    toastTimer = setTimeout(function () { t.hidden = true; }, opts.ms || 3500);
  };

  // =========================================================================
  // WIRING: run once at startup (called by rt-main.js)
  // =========================================================================
  ui.init = function () {
    tid('menu-btn').addEventListener('click', ui.openMenu);
    tid('fit-btn').addEventListener('click', function () { if (RT.viewer) { RT.viewer.fit(); } });
    tid('sheet-picker').addEventListener('change', function (e) {
      // A different sheet may not hold the open room; close the panel to keep things simple.
      var keepRoom = panelMode === 'room' ? panelRoomId : null;
      RT.viewer.showSheet(e.target.value);
      if (keepRoom) { RT.viewer.setSelected(keepRoom); renderRoom(); }
    });
    byId('rt-share-now').addEventListener('click', function () { ui.runShare(null); });

    // A room was tapped on the plan.
    RT.on('room:tap', function (d) { if (d && d.roomId) { ui.openRoom(d.roomId); } });

    // Something changed in the data: repaint those rooms and the open panel.
    RT.on('change', function (d) {
      var ids = (d && d.roomIds) || null;
      if (RT.viewer && RT.viewer.map) {
        if (ids && ids.length && ids.length <= 50) { ids.forEach(function (id) { RT.viewer.refreshRoom(id); }); }
        else { RT.viewer.refreshAll(); }
      }
      if (panelMode === 'room' && (!ids || !ids.length || ids.indexOf(panelRoomId) !== -1)) { renderRoom(); }
      ui.updateChip();
      ui.updateBanners();
    });

    // A save started, finished or failed.
    RT.on('save', function () { ui.updateChip(); ui.updateBanners(); });

    // Refresh the "2 min ago" part of the chip every 30 seconds.
    setInterval(ui.updateChip, 30000);

    // iOS only: stop two-finger page zoom outside the plan (the plan handles its own pinch).
    document.addEventListener('gesturestart', function (e) {
      if (!e.target.closest || !e.target.closest('#rt-plan')) { e.preventDefault(); }
    });

    ui.updateChip();
    ui.updateBanners();
  };
})();

/* ---- rt-main.js ---- */
/* ==========================================================================
   rt-main.js: startup, and the actions behind the buttons.

   This is the last script in the page. It connects the data half
   (RT.state, RT.store, RT.files) to the screen half (RT.viewer, RT.ui).

   Two ways the page can run (the "rt-kind" marker in the page head says which):
   - "project": a PROJECT file opened by double-click on a laptop. The project
     is inside the file itself. Load it and show it.
   - "app": the hosted, installable app. Show the Projects screen: projects
     already on this device, Open project, Load sample.

   RT.app.* are the actions the screen calls. They never throw at the caller:
   each returns a promise with a plain result the screen can show.
   ========================================================================== */
(function () {
  'use strict';

  var RT = window.RT = window.RT || {};
  var app = RT.app = {};

  var storeOk = false;          // true when the device database opened
  var askedPersist = false;     // we ask for persistent storage once, at the first project

  function errText(err) { return err && err.message ? err.message : String(err); }

  // ---- small key-value memory (device label, last sheet) -------------------
  // Uses the device database. Falls back to localStorage when the database is
  // not available (some browsers on file:// pages), and to nothing after that.
  function kvGet(key) {
    var viaStore = storeOk ? RT.store.kvGet(key).catch(function () { return undefined; }) : Promise.resolve(undefined);
    return viaStore.then(function (v) {
      if (v !== undefined && v !== null) { return v; }
      try { var raw = window.localStorage.getItem('rt:' + key); return raw === null ? null : JSON.parse(raw); }
      catch (e) { return null; }
    });
  }
  function kvSet(key, value) {
    try { window.localStorage.setItem('rt:' + key, JSON.stringify(value)); } catch (e) { /* not available: fine */ }
    if (!storeOk) { return Promise.resolve(); }
    return RT.store.kvSet(key, value).catch(function () { /* best effort */ });
  }

  // ---- where tiles come from -------------------------------------------------
  // The viewer calls RT.tileSource(hash) for every tile it needs and expects a
  // promise of a Blob (the picture bytes) or null.
  function setTileSourceEmbedded() {
    // Tiles are inside this page; rt-files decodes one at a time on demand.
    RT.tileSource = function (hash) {
      return Promise.resolve().then(function () { return RT.files.embeddedTile(hash); });
    };
  }
  function setTileSourceStore(projectId, mime) {
    // Tiles are in the device database, stored as raw bytes.
    RT.tileSource = function (hash) {
      return RT.store.getTile(projectId, hash).then(function (buf) {
        return buf ? new Blob([buf], { type: mime || 'image/webp' }) : null;
      });
    };
  }

  // ---- show a loaded project on screen ---------------------------------------
  function showLoadedProject() {
    var doc = RT.state.doc;
    RT.ui.closeDialog();
    RT.ui.projectLoaded();

    // Ask the browser to keep our data (spec section 9). Once is enough.
    if (!askedPersist && navigator.storage && navigator.storage.persist) {
      askedPersist = true;
      try { navigator.storage.persist().catch(function () {}); } catch (e) { /* ignore */ }
    }

    var sheets = doc.sheets || [];
    if (!sheets.length) { RT.viewer.clear(); return Promise.resolve(); }

    // Go back to the sheet that was open last time, when it still exists.
    return kvGet('lastSheet:' + RT.state.projectId).then(function (last) {
      var id = sheets[0].id;
      sheets.forEach(function (s) { if (s.id === last) { id = last; } });
      document.querySelector('[data-testid="sheet-picker"]').value = id;
      RT.viewer.showSheet(id);
    });
  }

  // ---- actions ---------------------------------------------------------------

  // Projects stored on this device (without their heavy contents).
  app.listProjects = function () {
    if (!storeOk) { return Promise.resolve([]); }
    return RT.store.listProjects().then(function (rows) { return rows || []; }).catch(function () { return []; });
  };

  // Open a project that is already on this device.
  app.openProjectById = function (projectId) {
    return Promise.resolve()
      .then(function () { return RT.state.flush ? RT.state.flush() : null; })   // save the one we are leaving
      .catch(function () { /* the red banner already tells the user */ })
      .then(function () { return RT.store.getProject(projectId); })
      .then(function (rec) {
        if (!rec || !rec.doc) { throw new Error('That project is no longer on this device.'); }
        var tilesIndex = rec.tiles || {};
        setTileSourceStore(projectId, tilesIndex.mime);
        // This document was just read from the device database, so it IS saved,
        // and the chip must show the time of that save, not a new one.
        return RT.state.load({ doc: rec.doc, tilesIndex: tilesIndex, projectId: projectId, mode: 'hosted',
          savedAt: rec.savedAt || null, importedAt: rec.importedAt || null });
      })
      .then(function () {
        if (app.deviceLabel) { RT.state.deviceLabel = app.deviceLabel; }
        return kvSet('lastProjectId', projectId);
      })
      .then(showLoadedProject)
      .then(function () { return { ok: true }; })
      .catch(function (err) {
        RT.ui.toast('Could not open the project: ' + errText(err), { ms: 6000 });
        return { ok: false, message: 'Could not open the project: ' + errText(err) };
      });
  };

  // "Open project": the user picked a file. Check what it is BEFORE trusting it
  // (the picker has no file-type filter, because filters gray out files on iPad).
  app.openProjectFile = function (file, onProgress) {
    return Promise.resolve()
      .then(function () { return RT.files.sniff(file); })
      .then(function (info) {
        var kind = info && info.kind;
        if (kind === 'status') {
          return { ok: false, message: 'That is a STATUS file (a small update). Open the PROJECT file first. Then use Menu, Share, Import a STATUS file.' };
        }
        if (kind !== 'project') {
          return { ok: false, message: 'That file is not a Room Tracker PROJECT file. Nothing was changed.' };
        }
        return RT.files.importProjectFile(file, onProgress).then(function (res) {
          return app.openProjectById(res.projectId).then(function (opened) {
            return tellKept(opened, res);
          });
        });
      })
      .catch(function (err) {
        return { ok: false, message: 'Could not open that file: ' + errText(err) + ' Nothing was changed.' };
      });
  };

  // After opening a file for a project that was already on this device, say
  // that the device's own work was kept (contract section 7 item 5).
  function tellKept(opened, res) {
    if (!opened || !opened.ok || !res || !res.keptDeviceState) { return opened; }
    var msg = 'Kept the work on this device. The drawings and rooms come from the file.';
    if (res.fileStateNewer) {
      msg += ' The file holds newer checks that were not loaded. To bring them in, import a STATUS file from the device that made them.';
    }
    RT.ui.toast(msg, { ms: 10000 });
    opened.keptDeviceState = true;
    opened.message = msg;
    return opened;
  }

  // "Load sample": copy the made-up sample plan that ships inside the app into
  // the device database, then open it like any other project.
  app.loadSample = function () {
    return Promise.resolve()
      .then(function () { return RT.files.installEmbeddedAsProject(); })
      .then(function (res) {
        var id = res && res.projectId;
        if (!id) {
          var emb = RT.files.readEmbedded();
          id = emb && emb.doc && emb.doc.project && emb.doc.project.id;
        }
        if (!id) { throw new Error('This copy of the app holds no sample.'); }
        return app.openProjectById(id).then(function (opened) { return tellKept(opened, res); });
      })
      .catch(function (err) {
        return { ok: false, message: 'Could not load the sample: ' + errText(err) };
      });
  };

  // "Share update": build the STATUS file and hand it to the share sheet (iPad)
  // or download it (laptop). Resolves to 'shared', 'downloaded', 'cancelled',
  // 'failed' (nothing went out; RT.files.lastShareProblem says why) or 'error'.
  // IMPORTANT: this must run directly inside the tap, with no waiting before
  // RT.files.shareOrDownload, or iOS refuses to open the share sheet.
  app.shareUpdate = function () {
    var outcomePromise;
    try {
      var doc = RT.state.doc;
      var html = RT.files.buildStatusHtml(doc, RT.state.deviceLabel || app.deviceLabel || '');
      var name = RT.files.statusFileName(doc);
      outcomePromise = Promise.resolve(RT.files.shareOrDownload(name, 'text/html', html));
    } catch (err) {
      outcomePromise = Promise.reject(err);
    }
    return outcomePromise.then(function (outcome) {
      if (outcome === 'shared' || outcome === 'downloaded') {
        // Record the time of a share that really happened and save it to the
        // device, so "Last shared" and "changes since the last share" survive
        // a reload. A failed save shows the red banner; the share still happened.
        return Promise.resolve(RT.state.markShared(RT.util.nowIso()))
          .catch(function () { /* the banner reports it */ })
          .then(function () { return outcome; });
      }
      return outcome;
    }).catch(function (err) {
      RT.ui.toast('Sharing failed: ' + errText(err), { ms: 6000 });
      return 'error';
    });
  };

  // Import a STATUS file, step 1 of 2: read it and compare it with this
  // device. Changes nothing. Phase 1 offers Replace or Cancel (merge comes
  // in Phase 3). Resolves to { ok: false, message } or
  // { ok: true, statusObj, summary: { mine, theirs, diff, theirsOlder } }.
  app.prepareStatusImport = function (file) {
    return Promise.resolve()
      .then(function () { return RT.files.sniff(file); })
      .then(function (info) {
        var kind = info && info.kind;
        if (kind === 'project') {
          return { ok: false, message: 'That is a PROJECT file, not a STATUS file. Use Menu, Projects, Open project for it. Nothing was changed.' };
        }
        if (kind !== 'status') {
          return { ok: false, message: 'That file is not a Room Tracker STATUS file. Nothing was changed.' };
        }
        return RT.files.readStatusFile(file).then(function (statusObj) {
          var doc = RT.state.doc;
          var mineProject = (doc && doc.project) || {};
          var theirs = (statusObj && statusObj.project) || {};
          if (!theirs.id || theirs.id !== mineProject.id) {
            return { ok: false, message: 'That STATUS file belongs to the project "' + (theirs.name || 'unknown') +
              '", which is not the one open now. Open that PROJECT file on this device first, then import the STATUS file there. Nothing was changed.' };
          }
          var m = statusObj.meta || {};
          var mine = {
            savedAt: RT.state.lastSavedAt || null,
            changedAt: (doc.meta && doc.meta.stateUpdatedAt) || null,
            device: RT.state.deviceLabel || app.deviceLabel || ''
          };
          var other = { savedAt: m.savedAt || null, changedAt: m.stateUpdatedAt || null, device: m.device || '' };
          return {
            ok: true,
            statusObj: statusObj,
            summary: {
              mine: mine,
              theirs: other,
              diff: RT.state.statusDiff(statusObj),
              // The file's last change is older than this device's: replacing undoes newer work here.
              theirsOlder: !!(mine.changedAt && (!other.changedAt || other.changedAt < mine.changedAt))
            }
          };
        });
      })
      .catch(function (err) {
        return { ok: false, message: 'Could not read that file: ' + errText(err) + ' Nothing was changed.' };
      });
  };

  // Import a STATUS file, step 2 of 2: "Replace mine" was tapped.
  // Resolves to { ok, message }; the message starts with "Updated " or "Not imported".
  app.applyStatusImport = function (statusObj) {
    return Promise.resolve()
      .then(function () { return RT.state.flush ? RT.state.flush() : null; })   // write what is on screen first
      .catch(function () { /* the red banner already tells the user */ })
      .then(function () {
        var diff = RT.state.applyStatusReplace(statusObj) || { items: 0, rooms: 0 };
        RT.viewer.refreshAll();
        var m = statusObj.meta || {};
        var src = 'the file saved ' + (m.savedAt ? RT.util.fmtLocal(m.savedAt) : 'at an unknown time') +
          (m.device ? ' on ' + m.device : '');
        var msg = 'Updated ' + diff.items + ' item' + (diff.items === 1 ? '' : 's') + ' in ' + diff.rooms +
          ' room' + (diff.rooms === 1 ? '' : 's') + '. This device now matches ' + src + '.';
        if (diff.checklist) { msg += ' ' + diff.checklist + ' checklist item' + (diff.checklist === 1 ? '' : 's') + ' changed.'; }
        return { ok: true, message: msg };
      })
      .catch(function (err) {
        return { ok: false, message: 'Not imported: ' + errText(err) + ' Nothing was changed.' };
      });
  };

  // ---- startup ---------------------------------------------------------------

  // Ask once for the device label (spec 7.10). It is remembered on the device.
  function ensureDeviceLabel() {
    return kvGet('deviceLabel').then(function (label) {
      if (label && typeof label === 'string') { return label; }
      return RT.ui.askDeviceLabel().then(function (typed) {
        return kvSet('deviceLabel', typed).then(function () { return typed; });
      });
    }).then(function (label) {
      app.deviceLabel = label;
      if (RT.state) { RT.state.deviceLabel = label; }
      return label;
    });
  }

  // True when two project documents hold the same content. The app version
  // stamp is left out: it is written at every save and says nothing about the work.
  function sameDoc(a, b) {
    function strip(d) {
      var c = JSON.parse(JSON.stringify(d || {}));
      if (c.meta) { delete c.meta.appVersion; }
      return c;
    }
    try { return RT.util.canonical(strip(a)) === RT.util.canonical(strip(b)); }
    catch (e) { return false; }
  }

  // A PROJECT file opened by double-click: the project is inside the page.
  function bootProjectFile() {
    var emb = RT.files.readEmbedded();
    if (!emb || !emb.doc) {
      RT.ui.toast('This file holds no project data.', { ms: 8000 });
      return Promise.resolve();
    }
    // A private copy, so the file's own state stays untouched in memory.
    var doc = JSON.parse(JSON.stringify(emb.doc));
    var projectId = doc.project && doc.project.id;
    var usedAutosave = false;
    var stored = null;

    // If this browser holds a newer autosave of the same project, take ONLY the
    // work from it (checks, notes, checklist, room edits, log) and say so.
    // Project, sheets, rooms and tiles always come from the file, so a revised
    // drawing never shows old outlines (contract section 7 item 6).
    var pick = storeOk
      ? RT.store.getProject(projectId).then(function (rec) {
          stored = rec || null;
          var mine = rec && rec.doc && rec.doc.meta && rec.doc.meta.stateUpdatedAt;
          var theirs = doc.meta && doc.meta.stateUpdatedAt;
          if (mine && (!theirs || mine > theirs)) { RT.files.takeState(doc, rec.doc); usedAutosave = true; }
        }).catch(function () { /* no autosave available: use the file */ })
      : Promise.resolve();

    return pick.then(function () {
      setTileSourceEmbedded();
      // When the autosave already holds exactly this document, it is saved:
      // show that save's time and do not write again.
      var savedAt = stored && stored.doc && sameDoc(doc, stored.doc) ? (stored.savedAt || null) : null;
      return RT.state.load({ doc: doc, tilesIndex: emb.tilesIndex, projectId: projectId, mode: 'embedded',
        savedAt: savedAt, importedAt: (stored && stored.importedAt) || null });
    }).then(function () {
      if (app.deviceLabel) { RT.state.deviceLabel = app.deviceLabel; }
      return showLoadedProject();
    }).then(function () {
      if (usedAutosave) {
        RT.ui.toast('Loaded newer saved work from this browser (' + RT.util.fmtLocal(doc.meta.stateUpdatedAt) + ') instead of the older state inside the file.', { ms: 9000 });
      }
    });
  }

  // The hosted app: start on the Projects screen.
  function bootApp() {
    RT.ui.projectLoaded();      // empty top bar
    RT.ui.showProjects();
    return Promise.resolve();
  }

  function boot() {
    window.RT_TEST = RT;        // lets the automated tests reach the app
    RT.ui.init();
    RT.viewer.init(document.getElementById('rt-plan'));

    // Remember the sheet on screen, per project.
    RT.on('sheet:shown', function (d) {
      if (RT.state && RT.state.projectId && d && d.sheetId) { kvSet('lastSheet:' + RT.state.projectId, d.sheetId); }
    });

    var kind = RT.util.kind();

    Promise.resolve()
      .then(function () { return RT.store.open(); })
      .then(function () { storeOk = true; }, function () { storeOk = false; })
      .then(ensureDeviceLabel)
      .then(function () { return kind === 'project' ? bootProjectFile() : bootApp(); })
      .catch(function (err) {
        if (window.console) { console.error('Room Tracker failed to start', err); }
        RT.ui.toast('Room Tracker could not start: ' + errText(err), { ms: 15000 });
      });
  }

  // The project data sits at the very end of the page, after this script, so
  // wait until the whole page has been read before starting.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
